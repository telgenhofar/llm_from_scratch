# Shared defaults for all training runs. Specific runs inherit and override.

model:
  vocab_size: 8192
  context_length: 512
  d_model: 384
  n_heads: 6
  n_layers: 6
  dropout: 0.1
  tie_weights: true

train:
  # Data paths — override per run
  data_path: data/train.bin
  val_data_path: data/val.bin

  # Optimizer
  batch_size: 32
  learning_rate: 3.0e-4
  min_lr: 3.0e-5
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0

  # Schedule
  max_steps: 50000
  warmup_steps: 500
  grad_accum_steps: 1

  # Logging / checkpointing
  log_interval: 10
  eval_interval: 500
  eval_iters: 50
  checkpoint_interval: 1000
  max_runtime_hours: 23.5

  # System
  device: cuda
  dtype: bfloat16
  compile_model: true
  seed: 1337