# Config file for tinystories pipeline check
# Should create a very small LM to verify functionality of pipeline

base: base.yaml

model:
  vocab_size: 4096
  context_length: 256
  d_model: 256
  n_heads: 4
  n_layers: 4

train:
  data_path: data/tinystories/train.bin
  val_data_path: data/tinystories/val.bin
  batch_size: 64
  max_steps: 10000
  warmup_steps: 200
  eval_interval: 250
  checkpoint_interval: 500