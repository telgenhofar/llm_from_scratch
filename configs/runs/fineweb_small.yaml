# Real training run on FineWeb-Edu. Targets ~150M params, trained on
# ~10B tokens. Fits in one or two 24-hour H100 jobs.

base: base.yaml

model:
  vocab_size: 8192
  context_length: 1024
  d_model: 512
  n_heads: 8
  n_layers: 8

train:
  data_path: data/fineweb_edu/train.bin
  val_data_path: data/fineweb_edu/val.bin
  batch_size: 24
  grad_accum_steps: 2
  learning_rate: 3.0e-4
  max_steps: 80000
  warmup_steps: 1000
  eval_interval: 1000
  checkpoint_interval: 2000